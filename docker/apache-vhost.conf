ServerName localhost
<VirtualHost *:__PORT__>
    ServerName localhost
    DocumentRoot /var/www/html/frontend

    # The previous local PHP server served the frontend directory.
    # Opening the public service root navigates to the homepage.
    RedirectMatch ^/$ /public/index.php

    <Directory /var/www/html/frontend>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # PHP view templates and reusable components must be included by PHP,
    # never opened as direct public URLs.
    <Directory /var/www/html/frontend/src/pages>
        Require all denied
    </Directory>
    <Directory /var/www/html/frontend/src/components>
        Require all denied
    </Directory>

    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
